<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eternia · Map Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <style>
        :root { color-scheme: dark; }
        html, body {
            margin: 0;
            padding: 0;
            background: #0a1410;
            color: #e8ede9;
            font-family: 'Pretendard', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        #editor-root { position: fixed; inset: 0; display: flex; flex-direction: column; }
        #editor-toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            background: rgba(15, 25, 20, 0.95);
            border-bottom: 1px solid rgba(106, 191, 149, 0.15);
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 12px;
            letter-spacing: 0.04em;
            z-index: 10;
        }
        #editor-toolbar > .group {
            display: flex;
            gap: 4px;
            padding: 4px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 6px;
        }
        #editor-toolbar button {
            background: transparent;
            border: 1px solid transparent;
            color: rgba(232, 237, 233, 0.7);
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-size: inherit;
            letter-spacing: inherit;
            transition: 120ms;
        }
        #editor-toolbar button:hover { color: #fff; background: rgba(255,255,255,0.05); }
        #editor-toolbar button[data-active="true"] {
            background: rgba(106, 191, 149, 0.18);
            border-color: rgba(106, 191, 149, 0.4);
            color: #6abf95;
        }
        #editor-toolbar .sep { width: 1px; height: 22px; background: rgba(106, 191, 149, 0.15); }
        #editor-toolbar .stage-id {
            color: #d4a574;
            text-transform: uppercase;
        }
        #editor-toolbar .save-btn {
            background: rgba(212, 165, 116, 0.18);
            border-color: rgba(212, 165, 116, 0.4);
            color: #d4a574;
        }
        #editor-toolbar .save-btn:hover {
            background: rgba(212, 165, 116, 0.3);
        }
        #editor-toolbar .grow { flex: 1; }
        #editor-body { flex: 1; display: flex; min-height: 0; }
        #editor-canvas-wrap {
            flex: 1;
            overflow: auto;
            background: repeating-conic-gradient(#0d1614 0% 25%, #0a1410 0% 50%) 0/20px 20px;
            position: relative;
        }
        #editor-canvas-wrap canvas {
            display: block;
            cursor: crosshair;
        }
        #editor-side {
            width: 280px;
            background: rgba(15, 25, 20, 0.95);
            border-left: 1px solid rgba(106, 191, 149, 0.15);
            display: flex;
            flex-direction: column;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11px;
        }
        #editor-side > h3 {
            margin: 0;
            padding: 12px 16px;
            font-size: 11px;
            letter-spacing: 0.12em;
            color: rgba(232, 237, 233, 0.5);
            font-weight: 500;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(106, 191, 149, 0.1);
        }
        #shapes-list { flex: 1; overflow-y: auto; padding: 4px; }
        .shape-row {
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            line-height: 1.4;
        }
        .shape-row:hover { background: rgba(255,255,255,0.04); }
        .shape-row[data-selected="true"] {
            background: rgba(212, 165, 116, 0.12);
            border-left: 2px solid #d4a574;
            padding-left: 10px;
        }
        .shape-row .swatch {
            width: 10px;
            height: 10px;
            border-radius: 2px;
        }
        .shape-row .meta {
            color: rgba(232, 237, 233, 0.5);
            font-size: 10px;
        }
        #status-bar {
            padding: 10px 16px;
            background: rgba(0,0,0,0.4);
            font-size: 10px;
            color: rgba(232, 237, 233, 0.6);
            border-top: 1px solid rgba(106, 191, 149, 0.1);
            min-height: 14px;
        }
        #status-bar.ok { color: #6abf95; }
        #status-bar.err { color: #ff6b6b; }
        .swatch.solid { background: #22c55e; }
        .swatch.oneway { background: #facc15; }
        .swatch.trigger { background: #3b82f6; }
        .swatch.spawn { background: #ef4444; }
        .swatch.start { background: #fff066; }
    </style>
</head>
<body>
    <div id="editor-root">
        <div id="editor-toolbar"></div>
        <div id="editor-body">
            <div id="editor-canvas-wrap"></div>
            <div id="editor-side">
                <h3>Shapes</h3>
                <div id="shapes-list"></div>
                <div id="status-bar">— ready —</div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/map-editor-main.ts"></script>
</body>
</html>
