<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eternia · Animation Editor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
    <style>
        :root { color-scheme: dark; }
        html, body {
            margin: 0;
            padding: 0;
            background: #0a1410;
            color: #e8ede9;
            font-family: 'Pretendard', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
        }
        #editor-root {
            position: fixed;
            inset: 0;
        }
        /* Hide the close button — in standalone mode there's nothing to
           close to (and accidentally clicking it would blank the editor). */
        [data-close] { display: none !important; }
        /* Standalone status bar — link back to game */
        #standalone-tag {
            position: fixed;
            top: 12px;
            left: 16px;
            font-size: 11px;
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            color: rgba(184, 194, 187, 0.6);
            letter-spacing: 0.08em;
            z-index: 10000;
            pointer-events: none;
        }
        #standalone-tag a {
            color: rgba(212, 165, 116, 0.85);
            text-decoration: none;
            pointer-events: auto;
        }
        #standalone-tag a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div id="standalone-tag">
        ETERNIA · ANIMATION EDITOR · <a href="/">← back to game</a>
    </div>
    <div id="editor-root"></div>
    <script type="module" src="/src/editor-main.ts"></script>
</body>
</html>
