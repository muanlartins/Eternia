root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/eternia-server ./cmd/eternia-server"
  entrypoint = "./tmp/eternia-server"
  args_bin = ["-addr", ":8080", "-data", "data/eternia.json"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "data", "testdata", "vendor"]
  exclude_regex = ["_test\\.go"]
  delay = 200
  log = "tmp/build-errors.log"
  stop_on_error = false
  send_interrupt = false
  kill_delay = "200ms"

[color]
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = true

[misc]
  clean_on_exit = false
